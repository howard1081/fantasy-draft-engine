<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>V3.1 Live Draft Engine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">2026 • FULL PPR • V3.1</div>
      <h1>Live Draft Engine</h1>
    </div>
    <div class="top-actions">
      <button id="undoBtn" class="ghost">Undo</button>
      <button id="settingsBtn" class="ghost">Settings</button>
    </div>
  </header>

  <main class="layout">
    <section class="main-column">
      <div class="status-row card">
        <div><span class="label">Pick</span><strong id="pickNumber">1</strong></div>
        <div><span class="label">Round</span><strong id="roundNumber">1</strong></div>
        <div><span class="label">On clock</span><strong id="onClock">Team 1</strong></div>
        <div><span class="label">My next</span><strong id="nextPick">1</strong></div>
      </div>

      <section id="hero" class="hero card"></section>

      <section class="card">
        <div class="section-head">
          <div>
            <div class="eyebrow">LIVE BOARD</div>
            <h2>Best options now</h2>
          </div>
          <div class="filters" id="positionFilters"></div>
        </div>
        <div id="recommendations" class="recommendations"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <div class="eyebrow">AVAILABLE PLAYERS</div>
            <h2>Mark picks instantly</h2>
          </div>
          <input id="searchInput" type="search" placeholder="Search player" autocomplete="off" />
        </div>
        <div id="availableList" class="player-list"></div>
      </section>
    </section>

    <aside class="side-column">
      <section class="card sticky">
        <div class="eyebrow">MY TEAM</div>
        <h2 id="myTeamTitle">Draft slot 1</h2>
        <div id="roster" class="roster"></div>
        <div id="rosterNeeds" class="needs"></div>
      </section>

      <section class="card">
        <div class="eyebrow">RECENT PICKS</div>
        <div id="recentPicks" class="recent-picks"></div>
      </section>
    </aside>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings-card" id="settingsForm">
      <div class="section-head">
        <div><div class="eyebrow">LEAGUE</div><h2>Draft settings</h2></div>
        <button value="cancel" class="icon-btn" aria-label="Close">×</button>
      </div>
      <label>Teams
        <select id="teamsSelect">
          <option>10</option><option selected>12</option>
        </select>
      </label>
      <label>Your draft slot
        <select id="slotSelect"></select>
      </label>
      <p class="muted">Changing settings resets the current draft.</p>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button id="applySettings" value="default" class="primary">Apply & reset</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
